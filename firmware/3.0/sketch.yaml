# Build settings for arduino-cli. From this folder:
#   arduino-cli compile
#   arduino-cli upload -p <port>   (find the port with: arduino-cli board list)
#
# The first compile downloads the pinned Teensy core and its compiler.
# Teensy core 1.59 and newer ship their own MTP library, which clashes
# with the copy in lib/MTP, so the core stays on 1.58.2.
default_profile: thermocam

profiles:
  thermocam:
    notes: DIY-Thermocam V3, Teensy 4.1 at 450 MHz, Serial + MTP Disk, -O3
    fqbn: teensy:avr:teensy41:usb=serialmtp,speed=450,opt=o3std
    platforms:
      - platform: teensy:avr (1.58.2)
        platform_index_url: https://www.pjrc.com/teensy/package_teensy_index.json
    libraries:
      - dir: include
      - dir: lib/ADC
      - dir: lib/Bounce
      - dir: lib/EEPROM
      - dir: lib/LittleFS
      - dir: lib/Metro
      - dir: lib/MTP
      - dir: lib/SD
      - dir: lib/SdFat
      - dir: lib/SPI
      - dir: lib/Time
      - dir: lib/Wire
