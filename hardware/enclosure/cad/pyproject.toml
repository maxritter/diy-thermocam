[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermocam-case"
version = "4.0.0"
description = "Parametric build123d enclosure CAD for the DIY-Thermocam V4.0 (3D-printed shell + laser-cut acrylic)"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.13.0",
    "ezdxf>=1.3.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
thermocam-case-export = "thermocam_case.export:main"
thermocam-case-render = "thermocam_case.render:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thermocam_case"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
