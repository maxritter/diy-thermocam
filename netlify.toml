# Monorepo Netlify configuration for https://www.diy-thermocam.net
# Builds the unified Astro 5 + Starlight + Pagefind + Tailwind CSS v4 site in website/ with Bun.

[build]
  base = "website"
  command = "bun run build"
  publish = "dist"
  # Skip deploys when only firmware, desktop app, or unrelated hardware CAD changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- website/ docs/ hardware/bom/"

[[redirects]]
  from = "/images/icon.png"
  to = "/images/website/icon.png"
  status = 301

[[redirects]]
  from = "/bom"
  to = "/docs/partlist/"
  status = 301

[[redirects]]
  from = "/bom/*"
  to = "/docs/partlist/"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
