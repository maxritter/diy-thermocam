name: Release

# One tag (v4.0.0) builds one GitHub release holding the firmware and Studio for every platform.
# Asset names are fixed so www.diy-thermocam.net can link /releases/latest/download/<name>.
# The macOS .dmg is built, signed and notarized on a Mac with the Developer ID identity and added
# to the draft release before it is published.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAURI_CLI: '@tauri-apps/cli@2.12.1'

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host unit tests
        working-directory: firmware/tests_host
        run: make clean && make test

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.6.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-release-${{ hashFiles('firmware/sketch.yaml') }}

      - name: Compile
        working-directory: firmware
        run: |
          arduino-cli compile --warnings all --export-binaries --output-dir ../out/build
          hex=$(find ../out/build -maxdepth 1 -name '*.hex' | head -n 1)
          test -n "$hex"
          cp "$hex" ../out/firmware.hex

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/firmware.hex

  linux:
    name: Studio for Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libhidapi-dev

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Checks
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun test
          cargo test --workspace

      - name: Build
        working-directory: app
        run: bunx "$TAURI_CLI" build --bundles appimage,deb

      - name: Name the files
        run: |
          mkdir out
          cp app/target/release/bundle/appimage/*.AppImage out/DIY-Thermocam-Studio-Linux.AppImage
          cp app/target/release/bundle/deb/*.deb out/DIY-Thermocam-Studio-Linux.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    name: Studio for Windows
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Build the app
        working-directory: app
        shell: bash
        run: |
          bun install --frozen-lockfile
          bunx "$TAURI_CLI" build --no-bundle

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\app\target\release\diy-thermocam.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Build the installer
        working-directory: app
        shell: bash
        run: |
          bunx "$TAURI_CLI" bundle --bundles nsis
          mkdir ../out
          cp target/release/bundle/nsis/*-setup.exe ../out/DIY-Thermocam-Studio-Windows.exe

      - name: Sign the installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\out\DIY-Thermocam-Studio-Windows.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Check both signatures
        shell: pwsh
        run: |
          foreach ($f in @("app\target\release\diy-thermocam.exe", "out\DIY-Thermocam-Studio-Windows.exe")) {
            $s = Get-AuthenticodeSignature $f
            Write-Output "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    name: Draft release
    needs: [firmware, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes="../.github/release-notes/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" ./* --draft --verify-tag \
            --title "DIY-Thermocam ${GITHUB_REF_NAME#v}" --notes-file "$notes"
