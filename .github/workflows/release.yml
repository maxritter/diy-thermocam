name: Release

on:
  push:
    tags:
      - 'firmware-v*'
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-firmware:
    name: Build & publish firmware release
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run firmware host C++17 unit tests
        working-directory: firmware/tests_host
        run: |
          make clean
          make test

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: latest

      - name: Cache Teensy core & toolchain
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-release-${{ hashFiles('firmware/sketch.yaml') }}

      - name: Compile firmware & package artifacts
        working-directory: firmware
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#firmware-v}"
          mkdir -p ../release-artifacts
          arduino-cli compile --warnings all --export-binaries --output-dir ../release-artifacts/build
          HEX_FILE=$(find ../release-artifacts/build -maxdepth 1 -name '*.hex' | head -n 1)
          test -n "$HEX_FILE"
          cp "$HEX_FILE" "../release-artifacts/diy-thermocam-v3-firmware-${VERSION}.hex"
          (
            cd ../release-artifacts
            zip "diy-thermocam-v3-firmware-${VERSION}.zip" "diy-thermocam-v3-firmware-${VERSION}.hex"
            sha256sum "diy-thermocam-v3-firmware-${VERSION}.hex" "diy-thermocam-v3-firmware-${VERSION}.zip" > SHA256SUMS.txt
          )

      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/diy-thermocam-v3-firmware-*.hex
            release-artifacts/diy-thermocam-v3-firmware-*.zip
            release-artifacts/SHA256SUMS.txt

  release-app:
    name: Build & publish desktop app (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libhidapi-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Install, verify frontend & run Rust core tests
        working-directory: app
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun test
          cargo test --workspace

      - name: Build & attach Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'DIY-Thermocam Desktop ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
