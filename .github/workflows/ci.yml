name: CI

on:
  push:
    branches:
      - master
      - overhaul-2026
  pull_request:
  # A manual run checks every subsystem, whatever changed.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed subsystems
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.firmware == 'true' }}
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      website: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.website == 'true' }}
      bom: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.bom == 'true' }}
      pcb: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.pcb == 'true' }}
      enclosure: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.enclosure == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            firmware:
              - 'firmware/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'firmware/src/general/colorschemes.cpp'
              - 'firmware/test/fixtures/**'
              - 'docs/protocol-v2.md'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - 'docs/**'
              - 'hardware/bom/**'
              - 'netlify.toml'
              - '.github/workflows/ci.yml'
            bom:
              - 'hardware/bom/**'
              - '.github/workflows/ci.yml'
            pcb:
              - 'hardware/pcb/**'
              - 'hardware/bom/**'
              - '.github/workflows/ci.yml'
            enclosure:
              - 'hardware/enclosure/**'
              - '.github/workflows/ci.yml'

  firmware-build:
    name: Firmware compile (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.6.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Arduino data dir
        id: arduino-dir
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "path=$HOME/Library/Arduino15" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "path=$LOCALAPPDATA/Arduino15" >> "$GITHUB_OUTPUT"
          else
            echo "path=$HOME/.arduino15" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Teensy core & toolchain
        uses: actions/cache@v6
        with:
          path: ${{ steps.arduino-dir.outputs.path }}
          key: arduino15-${{ runner.os }}-${{ hashFiles('firmware/sketch.yaml') }}

      - name: Compile firmware (zero warnings)
        working-directory: firmware
        shell: bash
        run: arduino-cli compile --warnings all

  firmware-host-tests-and-sim:
    name: Firmware host C++17 tests & UI simulator
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install host toolchain & zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ make zlib1g-dev

      - name: Run C++17 host unit tests
        working-directory: firmware/tests_host
        run: |
          make clean
          make test

      - name: Build UI simulator, run interactive UI tests & generate screenshots
        working-directory: firmware/sim
        run: |
          make clean
          make test
          make screenshots
          count=$(find out -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')
          echo "Generated $count simulator UI screenshots"
          test "$count" -ge 9

      - name: Upload firmware simulator screenshots
        uses: actions/upload-artifact@v7
        with:
          name: firmware-ui-simulator-screenshots
          path: firmware/sim/out/*.png
          retention-days: 14

  app-ci:
    name: Desktop app (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libhidapi-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Frontend install, Biome, typecheck, tests & build
        working-directory: app
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun test
          bun run build

      - name: Rust fmt, clippy, unit tests & Tauri check
        working-directory: app
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo check -p diy-thermocam-app

  website-ci:
    name: Website build, dist verification & link check
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install, lint, typecheck & build Astro 5 website
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run check
          bun run build

      - name: Verify built dist routes, assets, BOM & metadata
        run: node website/scripts/verify-dist.mjs

      - name: Check internal links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/website/dist --no-progress website/dist
          fail: true

  hardware-bom:
    name: Hardware BOM schema & integrity check
    needs: changes
    if: needs.changes.outputs.bom == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate hardware/bom/bom.csv
        run: python3 hardware/bom/validate_bom.py

  hardware-pcb:
    name: Hardware PCB KiCad ERC/DRC
    needs: changes
    if: needs.changes.outputs.pcb == 'true'
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - name: Run KiCad ERC/DRC on hardware/pcb/
        env:
          KICAD_CLI: /usr/bin/kicad-cli
        run: |
          board="hardware/pcb/diy-thermocam-v4.0"
          echo "Running ERC on ${board}.kicad_sch"
          kicad-cli sch erc --severity-error --exit-code-violations --output /tmp/erc.json --format json "${board}.kicad_sch"
          echo "Running DRC on ${board}.kicad_pcb"
          kicad-cli pcb drc --refill-zones --severity-error --exit-code-violations --output /tmp/drc.json --format json "${board}.kicad_pcb"

  hardware-enclosure:
    name: Hardware Enclosure CAD (build123d) geometry tests
    needs: changes
    if: needs.changes.outputs.enclosure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run parametric build123d geometry & clearance test suite
        run: |
          if [ ! -f hardware/enclosure/cad/pyproject.toml ]; then
            echo "::notice::hardware/enclosure/cad not present yet; skipping."
            exit 0
          fi
          cd hardware/enclosure/cad
          uv run --extra dev --python 3.12 pytest
