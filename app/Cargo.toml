[workspace]
resolver = "2"
members = [
  "crates/thermocam-core",
  "src-tauri",
]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/maxritter/diy-thermocam"
authors = ["Max Ritter"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
