[package]
name = "thermocam-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core protocol v2, radiometry, palettes, .DAT, high-res imaging, zero-FFmpeg export, and HalfKay flasher for DIY-Thermocam"

[dependencies]
base64 = "0.22"
crc32fast = "1.4"
gif = "0.13"
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
ihex = "3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mp4 = "0.14"
openh264 = { version = "0.9", features = ["source"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.7", default-features = false }
sha2 = "0.10"
thiserror = "2.0"
tiff = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
serialport = { version = "4.7", default-features = false, features = ["libudev"] }

[dev-dependencies]
tempfile = "3.15"
